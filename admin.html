<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174ea6">
<title>Admin – Deutsch-Ukrainisches Kompetenzzentrum</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#172033}
.app{max-width:900px;margin:auto;background:#fff;min-height:100vh}header{padding:22px;color:#fff;background:linear-gradient(135deg,#174ea6 0 72%,#ffd43b 72%)}main{padding:18px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card,.item{background:#f5f7fb;border-radius:14px;padding:14px;margin:9px 0}.card b{font-size:24px}
button,input,select,textarea{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #ccd3df;font:inherit}
button{border:0;background:#174ea6;color:#fff;font-weight:700;cursor:pointer}.light{background:#eaf0fa;color:#174ea6}.danger{background:#fff0f0;color:#9b1c1c}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.section{display:none}.section.active{display:block}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:16px 0}@media(max-width:700px){nav{grid-template-columns:1fr 1fr}}
.unread{display:inline-block;min-width:22px;padding:2px 7px;border-radius:999px;background:#b42318;color:#fff;font-size:12px;font-weight:800}
.chatperson{display:block;text-align:left;padding:12px;margin:8px 0}.chatperson small{display:block;margin-top:4px}.threadhead{padding:10px 0;font-weight:800}
.msg{padding:10px;border-radius:10px;background:#eef5ff;margin:8px 0}small{color:#667085}a{color:#174ea6}
.customer-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.mini{background:#fff;border:1px solid #e4e7ec;border-radius:10px;padding:8px;text-align:center}.mini b{display:block;font-size:20px}
</style>
</head>
<body><div class="app"><header><div style="font-size:36px">🔐</div><h1>Admin-Dashboard</h1><div>Deutsch-Ukrainisches Kompetenzzentrum Thüringen</div></header><main>
<div id="loginbox"><h2>Admin-Anmeldung</h2><div id="authmsg" class="msg">Bitte mit dem Mitarbeiterkonto anmelden.</div><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><button onclick="login()">Anmelden</button><button class="light" onclick="location.href='index.html'">← Zur Startseite</button></div>
<div id="dashboard" style="display:none">
<div class="actions"><button class="light" onclick="location.href='index.html'">← Kundenbereich</button><button class="danger" onclick="logout()">Abmelden</button></div>
<div class="grid">
<div class="card">👥<br><b id="nK">0</b><br>Kunden</div><div class="card">📅<br><b id="nA">0</b><br>Termine</div><div class="card">📨<br><b id="nC">0</b><br>Anfragen</div><div class="card">📄<br><b id="nD">0</b><br>Dokumente</div><div class="card">💬<br><b id="nM">0</b><br>Nachrichten</div>
</div>
<nav><button onclick="showSec('customers')">👥 Kunden</button><button onclick="showSec('docs')">📄 Dokumente</button><button onclick="showSec('apps')">📅 Termine</button><button onclick="showSec('contacts')">📨 Anfragen</button><button onclick="showSec('chats')">💬 Chat</button></nav>
<button class="light" onclick="loadAll()">↻ Alles aktualisieren</button>

<section id="customers" class="section active"><h2>👥 Kundenverwaltung</h2><div id="customerlist"></div></section>
<section id="docs" class="section"><h2>📄 Kundendokumente</h2><div id="doclist"></div></section>
<section id="apps" class="section"><h2>📅 Termine</h2><div id="applist"></div></section>
<section id="contacts" class="section"><h2>📨 Kontaktanfragen</h2><div id="contactlist"></div></section>
<section id="chats" class="section"><h2>💬 Kundennachrichten</h2><div id="chatusers"></div><div id="chatthread"></div></section>
</div></main></div>

<script>
const U="https://eqehktdeklulnyhbumrs.supabase.co",K="sb_publishable_zdn7_Zx-K21-QAHw9N3Y_A_3g3bk9lq";let token=sessionStorage.getItem('duk_admin_token')||null,user=null,activeChatUser=null;
function $(id){return document.getElementById(id)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(v){if(!v||String(v).includes('-infinity'))return '—';try{return new Date(v).toLocaleString('de-DE')}catch{return esc(v)}}
function fmtBytes(n){if(n==null)return '';if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
async function req(path,opt={}){opt.headers={...(opt.headers||{}),apikey:K,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(U+path,opt);const t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}
async function login(){$('authmsg').textContent='⏳ Anmeldung…';try{const d=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.access_token;user=d.user;sessionStorage.setItem('duk_admin_token',token);await enter()}catch(e){$('authmsg').textContent='❌ Anmeldung fehlgeschlagen.'}}
async function restore(){if(!token)return;try{const r=await fetch(U+'/auth/v1/user',{headers:{apikey:K,Authorization:'Bearer '+token}});if(!r.ok)throw Error();user=await r.json();await enter()}catch{sessionStorage.removeItem('duk_admin_token');token=null}}
async function enter(){try{await req('/rest/v1/rpc/admin_customer_overview',{method:'POST',body:'{}'});$('loginbox').style.display='none';$('dashboard').style.display='block';await loadAll()}catch(e){$('authmsg').textContent='⛔ Dieses Konto hat keine Admin-Berechtigung.';sessionStorage.removeItem('duk_admin_token');token=null;user=null}}
async function logout(){try{if(token)await req('/auth/v1/logout',{method:'POST'})}catch{}sessionStorage.removeItem('duk_admin_token');location.reload()}
function showSec(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
async function loadAll(){await Promise.all([loadCustomers(),loadDocs(),loadApps(),loadContacts(),loadAdminChats()])}

async function loadCustomers(){try{const rows=await req('/rest/v1/rpc/admin_customer_overview',{method:'POST',body:'{}'});$('nK').textContent=rows.length;$('customerlist').innerHTML=rows.length?rows.map(x=>`<div class="item"><b>👤 ${esc(x.display_name||x.email||'Kunde')}</b>${Number(x.unread_messages_count)>0?` <span class="unread">${esc(x.unread_messages_count)} neu</span>`:''}<br><small>${esc(x.email||'')}${x.phone?'<br>📞 <a href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a>':''}<br>Letzte Aktivität: ${fmtDate(x.latest_activity)}</small><div class="customer-stats"><div class="mini">📅<b>${esc(x.appointments_count)}</b><small>Termine</small></div><div class="mini">📄<b>${esc(x.documents_count)}</b><small>Dokumente</small></div><div class="mini">💬<b>${esc(x.messages_count)}</b><small>Nachrichten</small></div></div>${Number(x.messages_count)>0?`<button onclick="showSec('chats');openChat('${esc(x.user_id)}')">💬 Chat öffnen</button>`:''}</div>`).join(''):'<p>Noch keine Kunden.</p>'}catch(e){$('customerlist').innerHTML='<p>❌ Kunden konnten nicht geladen werden.</p>'}}

async function loadDocs(){try{const rows=await req('/rest/v1/user_documents?select=id,user_id,file_name,storage_path,mime_type,file_size,status,note,created_at,read_by_admin&order=created_at.desc');const profiles=await req('/rest/v1/customer_profiles?select=user_id,email,display_name,phone');const pmap=Object.fromEntries(profiles.map(p=>[p.user_id,p]));const unread=rows.filter(x=>!x.read_by_admin).length;$('nD').innerHTML=unread?`${rows.length} <span class="unread">${unread} neu</span>`:rows.length;$('doclist').innerHTML=rows.length?rows.map(x=>{const p=pmap[x.user_id]||{},who=p.display_name||p.email||x.user_id.slice(0,8)+'…';return `<div class="item"><b>📄 ${esc(x.file_name)}</b>${!x.read_by_admin?' <span class="unread">neu</span>':''}<br><small>Kunde: ${esc(who)}${p.phone?'<br>📞 '+esc(p.phone):''}<br>${fmtBytes(x.file_size)} · ${fmtDate(x.created_at)}</small>${x.note?`<p>${esc(x.note)}</p>`:''}<select onchange="setDocStatus('${esc(x.id)}',this.value)"><option ${x.status==='neu'?'selected':''}>neu</option><option ${x.status==='in_pruefung'?'selected':''}>in_pruefung</option><option ${x.status==='erledigt'?'selected':''}>erledigt</option></select><button class="light" onclick="openDoc('${encodeURIComponent(x.storage_path)}','${esc(x.id)}')">Öffnen</button></div>`}).join(''):'<p>Keine Dokumente.</p>'}catch(e){$('doclist').innerHTML='<p>❌ Dokumente konnten nicht geladen werden.</p>'}}
async function openDoc(encoded,id){try{const path=decodeURIComponent(encoded),r=await fetch(U+'/storage/v1/object/sign/user-documents/'+encodeURI(path),{method:'POST',headers:{apikey:K,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:120})});if(!r.ok)throw Error();const d=await r.json();await req('/rest/v1/user_documents?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({read_by_admin:true})});const url=d.signedURL?.startsWith('http')?d.signedURL:U+'/storage/v1'+d.signedURL;window.open(url,'_blank','noopener');await loadDocs()}catch(e){alert('Dokument konnte nicht geöffnet werden.')}}
async function setDocStatus(id,status){try{await req('/rest/v1/user_documents?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status})});await loadDocs();await loadCustomers()}catch(e){alert('Status konnte nicht gespeichert werden.')}}

async function loadApps(){try{const rows=await req('/rest/v1/appointments?select=id,user_id,name,phone,requested_date,service,status,note,created_at,read_by_admin,confirmed_time,confirmation_message&order=created_at.desc');const unread=rows.filter(x=>!x.read_by_admin).length;$('nA').innerHTML=unread?`${rows.length} <span class="unread">${unread} neu</span>`:rows.length;$('applist').innerHTML=rows.length?rows.map(x=>`<div class="item"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>📅 ${esc(x.requested_date)}</b><br><strong>${esc(x.service)}</strong></div>${!x.read_by_admin?'<span class="unread">neu</span>':''}</div><p><b>👤 ${esc(x.name)}</b><br>📞 <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></p>${x.note?`<p>📝 ${esc(x.note)}</p>`:''}<small>Erstellt: ${fmtDate(x.created_at)}</small><label><small>Bestätigte Uhrzeit</small><input id="time_${esc(x.id)}" type="time" value="${esc((x.confirmed_time||'').slice(0,5))}"></label><label><small>Nachricht an den Kunden</small><textarea id="msg_${esc(x.id)}" maxlength="1000">${esc(x.confirmation_message||'')}</textarea></label><select id="status_${esc(x.id)}"><option value="neu" ${x.status==='neu'?'selected':''}>Neu</option><option value="bestaetigt" ${x.status==='bestaetigt'?'selected':''}>Bestätigt</option><option value="erledigt" ${x.status==='erledigt'?'selected':''}>Erledigt</option></select><button onclick="saveAppointmentConfirmation('${esc(x.id)}')">✅ Termin speichern</button><button class="light" onclick="markAppointmentRead('${esc(x.id)}')">Als gelesen markieren</button></div>`).join(''):'<p>Keine Termine.</p>'}catch(e){$('applist').innerHTML='<p>❌ Termine konnten nicht geladen werden.</p>'}}
async function saveAppointmentConfirmation(id){try{const status=$('status_'+id).value,confirmed_time=$('time_'+id).value||null,confirmation_message=$('msg_'+id).value.trim()||null;await req('/rest/v1/appointments?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status,confirmed_time,confirmation_message,read_by_admin:true})});await loadApps();await loadCustomers();alert('Termin gespeichert.')}catch(e){alert('Termin konnte nicht gespeichert werden.')}}
async function markAppointmentRead(id){try{await req('/rest/v1/appointments?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({read_by_admin:true})});await loadApps()}catch(e){alert('Termin konnte nicht als gelesen markiert werden.')}}

async function loadContacts(){try{const rows=await req('/rest/v1/contact_requests?select=*&order=created_at.desc');const unread=rows.filter(x=>!x.read_by_admin).length;$('nC').innerHTML=unread?`${rows.length} <span class="unread">${unread} neu</span>`:rows.length;$('contactlist').innerHTML=rows.length?rows.map(x=>`<div class="item"><b>📨 ${esc(x.name||'Anfrage')}</b>${!x.read_by_admin?'<span class="unread">neu</span>':''}<br><small>${esc(x.email||'')} · ${fmtDate(x.created_at)}</small><p>${esc(x.message||'')}</p><select onchange="setContactStatus('${esc(x.id)}',this.value)"><option value="neu" ${x.status==='neu'?'selected':''}>Neu</option><option value="bearbeitet" ${x.status==='bearbeitet'?'selected':''}>Bearbeitet</option><option value="erledigt" ${x.status==='erledigt'?'selected':''}>Erledigt</option></select><button class="light" onclick="markContactRead('${esc(x.id)}')">Als gelesen markieren</button></div>`).join(''):'<p>Keine Anfragen.</p>'}catch(e){$('contactlist').innerHTML='<p>❌ Anfragen konnten nicht geladen werden.</p>'}}
async function setContactStatus(id,status){try{await req('/rest/v1/contact_requests?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status,read_by_admin:true})});await loadContacts()}catch(e){alert('Anfragestatus konnte nicht gespeichert werden.')}}
async function markContactRead(id){try{await req('/rest/v1/contact_requests?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({read_by_admin:true})});await loadContacts()}catch(e){alert('Anfrage konnte nicht als gelesen markiert werden.')}}

async function loadAdminChats(){try{const rows=await req('/rest/v1/chat_messages?select=id,user_id,sender,message,created_at,read_by_admin&order=created_at.desc'),profiles=await req('/rest/v1/customer_profiles?select=user_id,email,display_name,phone');const pmap=Object.fromEntries(profiles.map(p=>[p.user_id,p])),users=[...new Set(rows.map(x=>x.user_id))],unreadTotal=rows.filter(x=>x.sender==='user'&&!x.read_by_admin).length;$('nM').innerHTML=unreadTotal?`${rows.length} <span class="unread">${unreadTotal} neu</span>`:rows.length;$('chatusers').innerHTML=users.length?users.map(uid=>{const last=rows.find(x=>x.user_id===uid),p=pmap[uid]||{},unread=rows.filter(x=>x.user_id===uid&&x.sender==='user'&&!x.read_by_admin).length,label=p.display_name||p.email||uid.slice(0,8)+'…';return `<button class="light chatperson" onclick="openChat('${esc(uid)}')">👤 <b>${esc(label)}</b>${unread?` <span class="unread">${unread}</span>`:''}<small>${esc((last?.message||'').slice(0,90))}</small></button>`}).join(''):'<p>Keine Nachrichten.</p>'}catch(e){$('chatusers').innerHTML='<p>❌ Nachrichten konnten nicht geladen werden.</p>'}}
async function openChat(uid){activeChatUser=uid;try{const rows=await req('/rest/v1/chat_messages?select=id,user_id,sender,message,created_at&user_id=eq.'+encodeURIComponent(uid)+'&order=created_at.asc'),ps=await req('/rest/v1/customer_profiles?select=email,display_name,phone&user_id=eq.'+encodeURIComponent(uid)+'&limit=1'),who=ps?.[0]?.display_name||ps?.[0]?.email||uid,phone=ps?.[0]?.phone||'';$('chatthread').innerHTML='<div class="threadhead">Gespräch mit '+esc(who)+(phone?' · 📞 '+esc(phone):'')+'</div>'+rows.map(x=>`<div class="item" style="background:${x.sender==='admin'?'#fff7d6':'#eef5ff'}"><b>${x.sender==='admin'?'Wir':'Kunde'}</b><br>${esc(x.message)}<br><small>${fmtDate(x.created_at)}</small></div>`).join('')+'<textarea id="adminchattext" maxlength="3000" placeholder="Antwort schreiben"></textarea><button onclick="sendAdminChat()">Antwort senden</button>';await req('/rest/v1/chat_messages?user_id=eq.'+encodeURIComponent(uid)+'&sender=eq.user&read_by_admin=eq.false',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({read_by_admin:true})});await loadAdminChats();await loadCustomers()}catch(e){$('chatthread').innerHTML='<p>❌ Gespräch konnte nicht geladen werden.</p>'}}
async function sendAdminChat(){if(!activeChatUser)return;const m=$('adminchattext').value.trim();if(!m)return;try{await req('/rest/v1/chat_messages',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:activeChatUser,sender:'admin',message:m})});await openChat(activeChatUser)}catch(e){alert('Antwort konnte nicht gesendet werden.')}}
restore();
</script></body></html>
